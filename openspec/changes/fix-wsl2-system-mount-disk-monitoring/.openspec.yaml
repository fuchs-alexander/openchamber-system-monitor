schema: spec-driven
created: 2026-11-02
goal: |-
  Исправить обработку дисков в расширении openchamber-system-monitor:
  git@github.com:fuchs-alexander/openchamber-system-monitor.git

  Проблема:
  В WSL2 Ubuntu системный том, смонтированный по пути
  /usr/lib/linux-tools/6.18.54.1-microsoft-standard-WSL2,
  отображается как заполненный на 100%.

  Это служебный том с инструментами ядра WSL2, предназначенный
  для чтения. Его заполнение не свидетельствует о нехватке
  свободного пространства, однако расширение считает его
  проблемным диском и формирует ложные предупреждения.

  Цель:
  Исключить служебные тома WSL2 linux-tools из мониторинга
  заполненности дисков, не затрагивая обычные файловые системы
  и реальные предупреждения о нехватке места.

  Требования:
  1. Изучить текущую реализацию сбора и фильтрации дисков
     в src/service/collectors/disks.ts и parse-disks.ts.

  2. Реализовать распознавание служебных монтирований
     /usr/lib/linux-tools/*-microsoft-standard-WSL2
     без привязки к конкретной версии ядра.

  3. Исключить такие тома из списка контролируемых дисков,
     расчёта максимальной заполненности, предупреждений,
     критических состояний и счётчика проблем в интерфейсе.

  4. Не исключать обычные диски только потому, что они
     заполнены на 100% или смонтированы в режиме read-only.
     Не скрывать реальные проблемы с дисковым пространством.

  5. Сохранить корректную работу мониторинга в обычном Linux,
     WSL2, Docker-контейнерах, Windows и macOS.

  6. Добавить регрессионные тесты для служебного тома WSL2
     и обычного действительно заполненного диска.

  7. Выполнить предусмотренные проектом проверки и обновить
     dist/ в соответствии с правилами репозитория.

  Критерии готовности:
  - Служебный том WSL2 linux-tools не отображается как
    проблемный и не влияет на состояние System Monitor.
  - Настоящий заполненный диск по-прежнему вызывает
    соответствующее предупреждение.
  - Решение работает при обновлении версии ядра WSL2.
  - Существующие функции мониторинга не нарушены.
  - Все проверки проекта успешно проходят.

  Ограничения:
  Не менять пороги предупреждений, не отключать мониторинг
  дисков глобально и не выполнять несвязанный рефакторинг.
